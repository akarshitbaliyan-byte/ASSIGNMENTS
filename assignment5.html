<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>three Basic list types</title>
</head>

<body>
    <h1> Unordered</h1>
    <ul>
        <li> HTML</li>
        <li> CSS</li>
        <li> JavaScript</li>
    </ul>
    <h1> Ordered</h1>
    <ol>
        <li> install vs code</li>
        <li> create file</li>
        <li> open in browser</li>
    </ol>
    <h1> Description</h1>
    <dl>
        <dt> HTML</dt>
        <dd> hypertext markup language</dd>
        <dt> CSS</dt>
        <dd> cascading style sheets</dd>
    </dl>
</body>

</html>
