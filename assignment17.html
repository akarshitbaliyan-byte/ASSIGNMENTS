<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>validation forms</title>
</head>

<body>
    <form action="#" method="post">

        <input type="text" name="fullname" placeholder="Full name" required minlength="3" pattern="[A-Za-z ]+"
            title="Enter a valid name">
        <br><br>

        <input type="email" name="email" placeholder="you@college.edu" required>
        <br><br>

        <input type="tel" name="mobile" placeholder="10-digit mobile" required pattern="[0-9]{10}"
            title="Enter exactly 10 digits">
        <br><br>

        <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
        <br><br>

        <input type="number" name="age" placeholder="Age" min="17" required>
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>

</html>
