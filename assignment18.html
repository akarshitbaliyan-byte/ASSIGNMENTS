<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
</head>

<body>

    <header>
        <h1 align="center">ABC College Admission 2026</h1>
    </header>

    <main>

        <h2 align="center">Courses and Fees</h2>

        <table border="1" align="center" cellpadding="5">
            <caption>Available Courses</caption>
            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>₹90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>₹45,000</td>
            </tr>
        </table>

        <br>

        <fieldset style="width:300px; margin:auto;">
            <legend>Application Form</legend>

            <form>
                <label>Name:</label><br>
                <input type="text"><br><br>

                <label>Email:</label><br>
                <input type="email"><br><br>

                <label>Course:</label><br>
                <select>
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select><br><br>

                <label>Statement:</label><br>
                <textarea rows="4" cols="30"></textarea><br><br>

                <input type="submit" value="Apply">
            </form>
        </fieldset>

    </main>

    <footer>
        <p align="center">© 2026 ABC College</p>
    </footer>

</body>

</html>
