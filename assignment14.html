<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> nested tables</title>
</head>

<body>
    <table border="1" cellspacing="0" cellpadding="8">
        <tr>
            <th>Day</th>
            <th colspan="2">Lab Batches</th>
            <th>Faculty</th>
            <th>Room</th>
            <th>Time</th>
        </tr>

        <tr>
            <td rowspan="3">Friday</td>

            <th>Batch</th>
            <th>System</th>

            <td rowspan="3">Dr. Sharma</td>
            <td rowspan="3">Lab 2</td>
            <td rowspan="3">2-4 PM</td>
        </tr>

        <tr>
            <td>A1</td>
            <td>PC 1-20</td>
        </tr>

        <tr>
            <td>A2</td>
            <td>PC 21-40</td>
        </tr>
    </table>
</body>

</html>
